# 1. Admin Dashboard (app.wazflo.com)
server {
    server_name app.wazflo.com;

    root /var/www/wazflo_enterprise/web/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wazflo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wazflo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. .NET API (api.wazflo.com)
server {
    server_name api.wazflo.com;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wazflo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wazflo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 3. Main Landing Page (wazflo.com)
server {
    server_name wazflo.com www.wazflo.com;

    root /var/www/wazflo_enterprise/web/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wazflo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wazflo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS Redirects
server {
    listen 80;
    server_name wazflo.com www.wazflo.com app.wazflo.com api.wazflo.com;
    return 301 https://$host$request_uri;
}
